name: CI

# Tests EasyMed and publishes its images. Deploying is not done here: each
# hospital has its own deployment repo (e.g. afurqan-deployment) that pulls
# these images at a tag it chooses.

on:
  push:
    branches: [ "main" , "standalone-lab"]

env:
  # Docker Hub namespace the images are pushed to. Set the DOCKERHUB_NAMESPACE
  # repository variable to override.
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'mosesmbadi' }}


jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend test image
        run: |
          docker build -f backend/Dockerfile -t backend-test:ci ./backend

      # pytest gets --ds because the DJANGO_SETTINGS_MODULE below overrides
      # pytest.ini. `check` should see the real settings; the tests need
      # testing.py, which runs Celery tasks inline -- under base.py they are
      # queued on the memory:// broker and never run.
      - name: Run backend system checks & unit tests
        run: |
          docker run --rm \
            -e SECRET_KEY='django-insecure-test-key-for-ci-only' \
            -e DJANGO_SETTINGS_MODULE=easymed.settings.base \
            -e DEBUG=True \
            -e EMAIL_BACKEND='django.core.mail.backends.console.EmailBackend' \
            -e EMAIL_USE_TLS=True \
            -e EMAIL_HOST='localhost' \
            -e EMAIL_PORT=587 \
            -e EMAIL_HOST_USER='test@example.com' \
            -e EMAIL_HOST_PASSWORD='testpassword' \
            -e DEFAULT_FROM_EMAIL='test@example.com' \
            -e CELERY_BROKER_URL='memory://' \
            -e CELERY_RESULT_BACKEND='cache+memory://' \
            -e DB_ENGINE='django.db.backends.sqlite3' \
            -e POSTGRES_HOST='localhost' \
            -e POSTGRES_DB='test_db' \
            -e POSTGRES_USER='test_user' \
            -e POSTGRES_PASSWORD='test_password' \
            -e POSTGRES_PORT=5432 \
            -e S3_BUCKET_NAME='test-bucket' \
            -e AWS_ACCESS_KEY_ID='test-key-id' \
            -e AWS_SECRET_ACCESS_KEY='test-secret-key' \
            -e AWS_DEFAULT_REGION='us-east-1' \
            -e GEMINI_API_KEY='test-gemini-api-key-for-ci' \
            -e NEXT_PUBLIC_BACKEND_URL='http://localhost:8080/' \
            -e NEXT_PUBLIC_HMIS_VERSION='v0.0.1-test' \
            backend-test:ci sh -c "python manage.py check && pytest -v --ds=easymed.settings.testing"


  # ============================ BUILD & PUSH IMAGES ============================ #
  # Images are built here, never on a hospital's server: a Next.js production
  # build needs more memory than a server has spare while the stack is running.
  #
  # Tags:
  #   <full commit sha>  immutable; what a deployment should pin
  #   <branch>           moves with the branch, e.g. standalone-lab
  #   latest             main only, so a feature branch never moves it
  # ============================================================================= #
  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - test-backend

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./front-end
          - name: nginx
            context: ./nginx
          - name: backup
            context: ./backup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAMESPACE }}/easymed-${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # NEXT_PUBLIC_* are baked into the frontend bundle at build time and the
      # image is shared by every deployment, so they must hold values that are
      # true everywhere: the backend is reached as `api` on each deployment's
      # compose network. The other images ignore these build args.
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ vars.NEXT_PUBLIC_BACKEND_URL || 'http://api:8080/' }}
            NEXT_PUBLIC_HMIS_VERSION=${{ vars.NEXT_PUBLIC_HMIS_VERSION || 'v0.0.1' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
