services:
    # nginx, backend, worker, frontend and backup are built by CI and pushed to
    # Docker Hub (see .github/workflows/ci-cd.yml); the server only pulls them.
    # The deploy sets IMAGE_TAG to the commit being deployed. Run by hand
    # without it and you get :latest; to roll back, set IMAGE_TAG to an older
    # commit SHA and run `pull` and `up -d` again.
    nginx:
        image: ${IMAGE_NAMESPACE:-mosesmbadi}/easymed-nginx:${IMAGE_TAG:-latest}
        container_name: "nginx"
        volumes:
            - /var/log/nginx:/var/log/nginx
            - letsencrypt:/etc/letsencrypt
            - certbot-www:/var/www/certbot
        restart: always
        depends_on:
            - frontend
        ports:
            - 80:80
            - 443:443
        networks:
            - mks

    certbot:
        image: certbot/certbot
        volumes:
            - letsencrypt:/etc/letsencrypt
            - certbot-www:/var/www/certbot
        entrypoint: /bin/sh -c
        command: >
            "trap exit TERM; while :; do sleep 6h & wait $${!}; certbot renew --webroot -w /var/www/certbot; done"

    postgres:
        image: postgres:15
        container_name: postgres
        env_file:
            - ./.env
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - mks

    redis:
        image: redis:7.0-alpine
        container_name: redis
        command: redis-server --appendonly yes --replica-read-only no
        volumes:
            - redis:/etc/redis/
        ports:
            - 6379:6379
        networks:
            - mks
        restart: unless-stopped

    backend:
        image: ${IMAGE_NAMESPACE:-mosesmbadi}/easymed-backend:${IMAGE_TAG:-latest}
        container_name: api
        command: uvicorn --host 0.0.0.0 --port 8080 easymed.asgi:application
        ports:
            - 8080:8080
        env_file:
            - ./.env
        restart: unless-stopped
        depends_on:
            - redis
            - postgres
        networks:
            - mks
        labels:
            - "service: backend"

    worker:
        image: ${IMAGE_NAMESPACE:-mosesmbadi}/easymed-backend:${IMAGE_TAG:-latest}
        container_name: worker
        command: celery -A easymed worker --loglevel=INFO
        entrypoint: [] # Skip entrypoint to avoid running migrations
        restart: unless-stopped
        env_file:
            - ./.env
        depends_on:
            - backend # Wait for backend to finish migrations
            - redis
            - postgres
        networks:
            - mks
        labels:
            - "service: worker"

    frontend:
        # NEXT_PUBLIC_* are baked into this image when CI builds it (GitHub
        # repository variables), so changing them in the server's .env has no
        # effect on the bundle.
        image: ${IMAGE_NAMESPACE:-mosesmbadi}/easymed-frontend:${IMAGE_TAG:-latest}
        container_name: front-end
        restart: unless-stopped
        ports:
            - 3000:3000
        depends_on:
            - backend
        env_file:
            - ./.env
        networks:
            - mks

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        ports:
            - 9090:9090
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
            - ./prometheus/rules.yml:/etc/prometheus/rules.yml
        depends_on:
            - backend
            - worker
            - redis
        labels:
            - "service: prometheus"

    lis_server:
        image: mosesmbadi/hl7-astm-parser:latest
        container_name: lis-server
        ports:
            - 9091:9091
        env_file:
            - ./.env
        environment:
            - PYTHONUNBUFFERED=1
            - PYTHONPATH=/app/src
        command:
            [
                "uvicorn",
                "src.main:app",
                "--host",
                "0.0.0.0",
                "--port",
                "9091",
                "--reload",
            ]
        restart: unless-stopped
        networks:
            - mks

    backup:
        image: ${IMAGE_NAMESPACE:-mosesmbadi}/easymed-backup:${IMAGE_TAG:-latest}
        container_name: easymed-backup
        env_file:
            - ./.env
        volumes:
            - ./backup/data:/backups
        depends_on:
            - postgres
        networks:
            - mks
        restart: unless-stopped

volumes:
    postgres_data:
    redis:
    letsencrypt:
    certbot-www:

networks:
    mks:
        name: mks
        driver: bridge
